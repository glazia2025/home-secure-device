# === Networking ===
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=8

# === OpenThread FTD (Full Thread Device — Commissioner) ===
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
CONFIG_OPENTHREAD_BORDER_ROUTER=y
CONFIG_OPENTHREAD_COMMISSIONER=y

# === UART IPC to ESP32-S3 ===
# Async (EasyDMA) API ONLY. Do NOT also enable CONFIG_UART_INTERRUPT_DRIVEN:
# Zephyr forbids both APIs on one peripheral (CONFIG_UART_EXCLUSIVE_API_CALLBACKS),
# and on nRF UARTE it makes the per-instance binding for uart1 indeterminate, which
# silently killed RX in earlier builds. uart_ipc.c uses the async DMA path.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Per-instance override for uart1. The USB-CDC console enables the *global*
# CONFIG_UART_INTERRUPT_DRIVEN, which makes CONFIG_UART_1_INTERRUPT_DRIVEN default y and
# gates out CONFIG_UART_1_ASYNC (Kconfig: depends on !UART_1_INTERRUPT_DRIVEN). Without
# this, uart_callback_set() returns -ENOSYS (-88) and async RX never arms. uart1 is used
# ONLY by our async IPC code, so turning interrupt-driven off for it is safe; the console
# is a separate CDC-ACM device and keeps the global symbol.
CONFIG_UART_1_INTERRUPT_DRIVEN=n
CONFIG_UART_1_ASYNC=y

# Receiver must stay powered so asynchronously-arriving frames are never clipped/dropped.
# This defaults to y (because PM_DEVICE is off), which power-cycles the UARTE RX between
# operations -> intermittent, connect-order-dependent RX and garbled leading bytes (0xf8).
# Our RX is always-on waiting for PINGs, so keep the receiver enabled continuously.
CONFIG_UART_1_NRF_ASYNC_LOW_POWER=n

# === GPIO ===
CONFIG_GPIO=y

# === Console via USB CDC ACM (no USB-UART adapter needed) ===
# Logs appear on /dev/ttyACM* when XIAO is plugged into laptop.
# NCS 2.x: USB + MPSL coexist via Zephyr clock-control arbitration.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# === Logging ===
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# === System ===
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
